name: aishield

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aishield}
      POSTGRES_USER: ${POSTGRES_USER:-aishield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aishield}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      AISHIELD_ENVIRONMENT: ${AISHIELD_ENVIRONMENT:-development}
      AISHIELD_LOG_LEVEL: ${AISHIELD_LOG_LEVEL:-INFO}
      AISHIELD_COMPUTE_DEVICE: cpu
      AISHIELD_DATABASE_URL: postgresql://${POSTGRES_USER:-aishield}:${POSTGRES_PASSWORD:-aishield}@postgres:5432/${POSTGRES_DB:-aishield}
      # "journal" keeps metadata in a local file; "postgresql" shares it across processes.
      AISHIELD_METADATA_BACKEND: ${AISHIELD_METADATA_BACKEND:-journal}
      AISHIELD_REDIS_URL: redis://redis:6379/0
      AISHIELD_ARTIFACT_ROOT: /app/artifacts
      AISHIELD_MODEL_ROOT: /app/artifacts/models
      AISHIELD_DATASET_ROOT: /app/data
      AISHIELD_ALLOW_PUBLIC_DOWNLOADS: ${AISHIELD_ALLOW_PUBLIC_DOWNLOADS:-false}
      AISHIELD_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    volumes:
      - artifact-data:/app/artifacts
      - dataset-data:/app/data
    ports:
      - "${AISHIELD_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${AISHIELD_DASHBOARD_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    profiles: ["gpu"]
    command: ["nvidia-smi"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

volumes:
  artifact-data:
  dataset-data:
  postgres-data:
  redis-data:
