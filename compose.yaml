name: aishield

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aishield}
      POSTGRES_USER: ${POSTGRES_USER:-aishield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aishield}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      AISHIELD_ENVIRONMENT: ${AISHIELD_ENVIRONMENT:-development}
      AISHIELD_LOG_LEVEL: ${AISHIELD_LOG_LEVEL:-INFO}
      AISHIELD_COMPUTE_DEVICE: cpu
      AISHIELD_DATABASE_URL: postgresql://${POSTGRES_USER:-aishield}:${POSTGRES_PASSWORD:-aishield}@postgres:5432/${POSTGRES_DB:-aishield}
      # "journal" keeps metadata in a local file; "postgresql" shares it across processes.
      AISHIELD_METADATA_BACKEND: ${AISHIELD_METADATA_BACKEND:-journal}
      # "inprocess" runs jobs on the API's threads; "redis" hands them to the worker.
      AISHIELD_JOB_BACKEND: ${AISHIELD_JOB_BACKEND:-inprocess}
      AISHIELD_REDIS_URL: redis://redis:6379/0
      AISHIELD_ARTIFACT_ROOT: /app/artifacts
      AISHIELD_MODEL_ROOT: /app/artifacts/models
      AISHIELD_DATASET_ROOT: /app/data
      AISHIELD_ALLOW_PUBLIC_DOWNLOADS: ${AISHIELD_ALLOW_PUBLIC_DOWNLOADS:-false}
      AISHIELD_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
      # Recorded in every evidence envelope; set it to the digest actually deployed.
      AISHIELD_CONTAINER_IMAGE_DIGEST: ${AISHIELD_CONTAINER_IMAGE_DIGEST:-}
    volumes:
      - artifact-data:/app/artifacts
      - dataset-data:/app/data
    ports:
      - "${AISHIELD_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Isolated evaluation worker. Enable with:
  #   AISHIELD_METADATA_BACKEND=postgresql AISHIELD_JOB_BACKEND=redis \
  #     docker compose --profile worker up --build
  # The API then queues work instead of running it, and this container owns the
  # CPU and memory the heavy torch runs need.
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["aishield-worker"]
    environment:
      AISHIELD_ENVIRONMENT: ${AISHIELD_ENVIRONMENT:-development}
      AISHIELD_LOG_LEVEL: ${AISHIELD_LOG_LEVEL:-INFO}
      AISHIELD_COMPUTE_DEVICE: cpu
      AISHIELD_DATABASE_URL: postgresql://${POSTGRES_USER:-aishield}:${POSTGRES_PASSWORD:-aishield}@postgres:5432/${POSTGRES_DB:-aishield}
      AISHIELD_REDIS_URL: redis://redis:6379/0
      AISHIELD_ARTIFACT_ROOT: /app/artifacts
      AISHIELD_MODEL_ROOT: /app/artifacts/models
      AISHIELD_DATASET_ROOT: /app/data
      AISHIELD_ALLOW_PUBLIC_DOWNLOADS: ${AISHIELD_ALLOW_PUBLIC_DOWNLOADS:-false}
      AISHIELD_METADATA_BACKEND: postgresql
      AISHIELD_JOB_BACKEND: redis
      AISHIELD_CONTAINER_IMAGE_DIGEST: ${AISHIELD_CONTAINER_IMAGE_DIGEST:-}
    volumes:
      - artifact-data:/app/artifacts
      - dataset-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${AISHIELD_DASHBOARD_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # CUDA evaluation worker. Requires the NVIDIA Container Toolkit. Enable with:
  #   AISHIELD_METADATA_BACKEND=postgresql AISHIELD_JOB_BACKEND=redis \
  #     docker compose --profile gpu-worker up --build
  # The API stays on CPU and hands heavy evaluations here.
  gpu-worker:
    profiles: ["gpu-worker"]
    build:
      context: .
      dockerfile: docker/worker.cuda.Dockerfile
    environment:
      AISHIELD_ENVIRONMENT: ${AISHIELD_ENVIRONMENT:-development}
      AISHIELD_LOG_LEVEL: ${AISHIELD_LOG_LEVEL:-INFO}
      # The registry refuses to start rather than fall back to CPU, so a run
      # recorded as CUDA really used CUDA.
      AISHIELD_COMPUTE_DEVICE: cuda
      AISHIELD_DATABASE_URL: postgresql://${POSTGRES_USER:-aishield}:${POSTGRES_PASSWORD:-aishield}@postgres:5432/${POSTGRES_DB:-aishield}
      AISHIELD_REDIS_URL: redis://redis:6379/0
      AISHIELD_ARTIFACT_ROOT: /app/artifacts
      AISHIELD_MODEL_ROOT: /app/artifacts/models
      AISHIELD_DATASET_ROOT: /app/data
      AISHIELD_ALLOW_PUBLIC_DOWNLOADS: ${AISHIELD_ALLOW_PUBLIC_DOWNLOADS:-false}
      AISHIELD_METADATA_BACKEND: postgresql
      AISHIELD_JOB_BACKEND: redis
      AISHIELD_CONTAINER_IMAGE_DIGEST: ${AISHIELD_CONTAINER_IMAGE_DIGEST:-}
    volumes:
      - artifact-data:/app/artifacts
      - dataset-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    restart: unless-stopped

  gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04@sha256:0f6bfcbf267e65123bcc2287e2153dedfc0f24772fb5ce84afe16ac4b2fada95
    profiles: ["gpu"]
    command: ["nvidia-smi"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

volumes:
  artifact-data:
  dataset-data:
  postgres-data:
  redis-data:
