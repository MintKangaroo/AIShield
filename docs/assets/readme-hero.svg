<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">AIShield</title>
  <desc id="description">Reproducible adversarial robustness research console</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121621"/>
      <stop offset=".55" stop-color="#0b0e16"/>
      <stop offset="1" stop-color="#111a18"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d0ff72"/>
      <stop offset="1" stop-color="#92cb28"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0v34" fill="none" stroke="#ffffff" stroke-opacity=".025"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <rect x=".5" y=".5" width="1199" height="359" rx="17.5" fill="none" stroke="#303747"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <circle cx="1017" cy="178" r="130" fill="none" stroke="#bbf451" stroke-opacity=".12"/>
  <ellipse cx="1017" cy="178" rx="170" ry="90" fill="none" stroke="#82906d" stroke-opacity=".18" transform="rotate(-17 1017 178)"/>
  <ellipse cx="1017" cy="178" rx="150" ry="69" fill="none" stroke="#778099" stroke-opacity=".14" transform="rotate(22 1017 178)"/>
  <circle cx="1125" cy="78" r="5" fill="#bbf451" filter="url(#glow)"/>
  <circle cx="864" cy="198" r="5" fill="#52b6ff" filter="url(#glow)"/>
  <circle cx="954" cy="292" r="5" fill="#9e84ff" filter="url(#glow)"/>
  <g transform="translate(967 128)">
    <rect x="0" y="0" width="100" height="100" rx="27" fill="#11181a" stroke="#bbf451" stroke-opacity=".45" transform="rotate(45 50 50)"/>
    <path d="M50 23 73 32v17c0 15-9 24-23 29-14-5-23-14-23-29V32l23-9Z" fill="none" stroke="url(#lime)" stroke-width="5" stroke-linejoin="round"/>
    <path d="m39 49 8 8 15-19" fill="none" stroke="#bbf451" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="72" y="86" fill="#8a94a8" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="600" letter-spacing="3">AI SECURITY RESEARCH PLATFORM</text>
  <text x="68" y="170" fill="#f0f2f8" font-family="'DM Sans', Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">AIShield</text>
  <text x="72" y="217" fill="#a0a8b9" font-family="'DM Sans', Arial, sans-serif" font-size="22">Reproducible adversarial robustness, with evidence attached.</text>
  <g font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">
    <g transform="translate(72 267)">
      <rect width="147" height="34" rx="17" fill="#bbf451" fill-opacity=".08" stroke="#bbf451" stroke-opacity=".3"/>
      <circle cx="19" cy="17" r="4" fill="#bbf451"/>
      <text x="33" y="21" fill="#a9c37b">CLEAN BASELINE</text>
    </g>
    <g transform="translate(233 267)">
      <rect width="78" height="34" rx="17" fill="#9e84ff" fill-opacity=".09" stroke="#9e84ff" stroke-opacity=".3"/>
      <text x="20" y="21" fill="#b4a6ef">FGSM</text>
    </g>
    <g transform="translate(325 267)">
      <rect width="72" height="34" rx="17" fill="#9e84ff" fill-opacity=".09" stroke="#9e84ff" stroke-opacity=".3"/>
      <text x="21" y="21" fill="#b4a6ef">PGD</text>
    </g>
    <g transform="translate(411 267)">
      <rect width="168" height="34" rx="17" fill="#52b6ff" fill-opacity=".08" stroke="#52b6ff" stroke-opacity=".28"/>
      <text x="20" y="21" fill="#7cb9dc">CONTENT-ADDRESSED</text>
    </g>
  </g>
  <text x="1128" y="330" fill="#536077" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="end">MODEL · DATA · SEED · ENVIRONMENT · ARTIFACTS</text>
