name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aishield
          POSTGRES_USER: aishield
          POSTGRES_PASSWORD: aishield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aishield -d aishield"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Exercise the shared metadata store and job broker; without these the
      # corresponding tests skip instead of failing.
      AISHIELD_TEST_DATABASE_URL: postgresql://aishield:aishield@127.0.0.1:5432/aishield
      AISHIELD_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: >-
          python -m pip install torch==2.13.0 torchvision==0.28.0
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install AIShield
        run: python -m pip install -e ".[dev,ml,postgres,redis]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy .
      - name: Test
        run: python -m pytest
      - name: Verify generated schema
        run: python -m aishield.schemas.export --check schemas/experiment-result.schema.json

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: Type check
        run: npm --prefix web run check
      - name: Test
        run: npm --prefix web run test
      - name: Build
        run: npm --prefix web run build

  docker-cpu-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose profiles
        run: |
          docker compose config --quiet
          docker compose --profile gpu config --quiet
      - name: Start CPU demo
        run: docker compose up --build --detach
      - name: Verify API and dashboard
        run: |
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8000/api/v1/health/live
          curl --fail --retry 15 --retry-delay 2 --retry-all-errors http://localhost:3000/
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop demo
        if: always()
        run: docker compose down --volumes
