[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aishield"
version = "0.1.0"
description = "A reproducible security evaluation platform for machine-learning systems."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AI Security Lab Contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]
ml = [
  "matplotlib==3.11.1",
  "numpy==2.4.4",
  "torch==2.13.0",
  "torchvision==0.28.0",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]
redis = [
  "redis>=5,<7",
]

[project.scripts]
aishield-api = "aishield.api.main:run"
aishield-run = "aishield.cli.experiment:main"
aishield-worker = "aishield.cli.worker:main"
aishield-export-schema = "aishield.schemas.export:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aishield"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["torchvision", "torchvision.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=aishield --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
